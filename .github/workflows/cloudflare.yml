# Deploys the Worker to the EXCS Cloudflare account on every push to main,
# and when started by hand.
#
# A local wrangler login can be the wrong Cloudflare account
# (id d058c8ec4c5caeadbd55cf293f3d2d32), so a bare `wrangler deploy` would
# create hack-sw-website there.
#
# Required secrets, from the EXCS account (org secrets scoped to this repo):
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
# Sponsor notification uses the SPONSOR_EMAIL binding in wrangler.jsonc.
# Optional Worker secret, set on the EXCS account (not in this workflow):
#   SPONSOR_NOTIFY_EMAIL — verified Email Routing destination, only if sends
#   to sponsors@exehacks.excs.uk are rejected. Do not commit that address.
name: Deploy to Cloudflare (EXCS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-excs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse the wrong Cloudflare account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is empty. Use the EXCS Cloudflare account ID."
            exit 1
          fi
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "d058c8ec4c5caeadbd55cf293f3d2d32" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is the wrong Cloudflare account. ExeHacks must deploy to the EXCS account."
            exit 1
          fi

      - name: Build static export
        run: npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply exehacks-interest --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
